case: gemini-docs-site-table
files: ["GEMINI.md"]
rules:
  # | Use pnpm for all commands; do not use npm or yarn. | The lockfile is `pnpm-lock.yaml`. |
  - file: GEMINI.md
    line: 10
    status: active
    type: command_forbidden
    scope_paths: ["**"]
    violates: ["npm install", "yarn add vitepress", "npm run docs:build"]
    obeys: ["pnpm install", "pnpm add -D vitepress", "pnpm dev"]
  # | Do not edit anything in `docs/api/`. | It is generated by `pnpm gen:api`. |
  - file: GEMINI.md
    line: 11
    status: active
    type: path_forbidden
    scope_paths: ["**"]
    violates: ["docs/api/index.md", "docs/api/commands/deploy.md"]
    obeys: ["docs/guides/quick-start.md", "docs/.vitepress/config.ts"]
  # | Name new pages with lowercase words separated by hyphens. | URLs are derived from file names. |
  - file: GEMINI.md
    line: 12
    status: active
    type: file_naming
    scope_paths: ["**"]
    violates: ["docs/guides/Quick_Start.md", "docs/guides/QuickStart.md"]
    obeys: ["docs/guides/quick-start.md", "docs/reference/cli-flags.md"]
  # | Do not use raw HTML such as `<div>` or `<font>` in Markdown pages. | It breaks the dark theme. |
  - file: GEMINI.md
    line: 13
    status: active
    type: content_forbidden_added
    scope_paths: ["**"]
    violates: ["docs/guides/intro.md: <div class=\"note\">Heads up</div>", "docs/guides/intro.md: <font color=\"red\">careful</font>"]
    obeys: ["docs/guides/intro.md: ::: tip", "docs/guides/intro.md: Heads up, this step is optional."]
  # | New pages start with a `---` front matter block. | VitePress needs it for the page title. |
  - file: GEMINI.md
    line: 14
    status: active
    type: content_required_added
    scope_paths: ["**"]
    violates: ["docs/guides/intro.md: # Introduction", "docs/reference/cli-flags.md: Flags are listed below."]
    obeys: ["docs/guides/intro.md: ---", ".vitepress/theme.ts: export default {};"]
  # | Commit messages start with `docs:`, `site:` or `ci:`. | Release notes are built from them. |
  - file: GEMINI.md
    line: 15
    status: active
    type: commit_message
    scope_paths: ["**"]
    violates: ["Update intro page", "feat: add quick start", "doc: fix typo"]
    obeys: ["docs: add quick start", "site: new sidebar", "ci: cache pnpm store"]
  # | Keep paragraphs short. | Readers skim. |
  - file: GEMINI.md
    line: 16
    status: uncheckable
  # | Explain acronyms on first use. | Not everyone knows them. |
  - file: GEMINI.md
    line: 17
    status: uncheckable
