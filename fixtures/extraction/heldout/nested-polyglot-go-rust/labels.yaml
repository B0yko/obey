case: nested-polyglot-go-rust
files: ["AGENTS.md", "go/AGENTS.md", "rust/AGENTS.md"]
rules:
  # - 🚫 Do not run `git commit`; the maintainer commits after reviewing.
  - file: AGENTS.md
    line: 8
    status: active
    type: no_commit
    scope_paths: ["**"]
    violates: ["git commit -m \"batch flush\"", "git commit -a -m \"fix shipper\""]
    obeys: ["git status", "git diff"]
  # - 🚫 Never `git push`, not even to a fork.
  - file: AGENTS.md
    line: 9
    status: active
    type: no_push
    scope_paths: ["**"]
    violates: ["git push", "git push fork main"]
    obeys: ["git status", "git log -3"]
  # - 📝 Keep your summary to a few sentences.
  - file: AGENTS.md
    line: 10
    status: uncheckable
  # - 🧭 Prefer the simplest design that works.
  - file: AGENTS.md
    line: 11
    status: uncheckable
  # - ✅ After editing Go files, run `go vet ./...` inside `go/`.
  - file: go/AGENTS.md
    line: 6
    status: active
    type: command_required
    scope_paths: ["go/**"]
    violates: ["go build ./...", "go test ./...", "gofmt -l ."]
    obeys: ["go vet ./...", "cd go && go vet ./..."]
  # - ✅ Name Go files in lower_snake_case.
  - file: go/AGENTS.md
    line: 7
    status: active
    type: file_naming
    scope_paths: ["go/**"]
    violates: ["go/internal/store/LogStore.go", "go/internal/store/log-store.go"]
    obeys: ["go/internal/store/log_store.go", "go/cmd/cormorant/main.go"]
  # - 🚫 `internal/gen/` is generated by `go generate`; don't edit it.
  - file: go/AGENTS.md
    line: 8
    status: active
    type: path_forbidden
    scope_paths: ["go/**"]
    violates: ["go/internal/gen/types.go", "go/internal/gen/client/ship.go"]
    obeys: ["go/internal/store/log_store.go", "go/go.mod"]
  # - 🚫 Don't introduce new modules in `go.mod`.
  - file: go/AGENTS.md
    line: 9
    status: active
    type: dependency_unchanged
    scope_paths: ["go/**"]
    violates: ["go get github.com/rs/zerolog", "go/go.mod: +github.com/google/uuid"]
    obeys: ["go mod tidy", "go build ./..."]
  # - 🚫 No `.unwrap()` in `src/`; propagate errors with `?`.
  - file: rust/AGENTS.md
    line: 5
    status: active
    type: content_forbidden_added
    scope_paths: ["rust/**"]
    violates: ["rust/src/frame.rs:     let n = header.parse().unwrap();", "rust/src/lib.rs: let buf = read_all(path).unwrap();"]
    obeys: ["rust/src/frame.rs:     let n = header.parse()?;", "rust/tests/frame.rs:     let n = header.parse().unwrap();"]
  # - 🚫 Don't add crates to `Cargo.toml` without approval.
  - file: rust/AGENTS.md
    line: 6
    status: active
    type: dependency_unchanged
    scope_paths: ["rust/**"]
    violates: ["cargo add zstd", "rust/Cargo.toml: +lz4_flex"]
    obeys: ["cargo build", "cargo test"]
  # - ✅ Document every public function.
  - file: rust/AGENTS.md
    line: 7
    status: uncheckable
