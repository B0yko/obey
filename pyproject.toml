[project]
name = "obey-cli"
version = "0.1.0"
description = "Unit tests for AGENTS.md: turns agent instructions into checkable rules, runs your coding agent on tempting tasks in a sandbox, measures per-rule compliance from what it actually did, and compiles the rules it ignores into hooks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrii Boiko" }]
requires-python = ">=3.10"
keywords = ["agents-md", "claude-md", "coding-agents", "instruction-following", "hooks", "pre-commit", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
study = ["matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
obey = "obey_cli.cli:main"

[project.urls]
Homepage = "https://github.com/B0yko/obey"
Issues = "https://github.com/B0yko/obey/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obey_cli"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/study/results/raw"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.26.0.20261006",
    "numpy>=2.2.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["fixtures", "study/repos", "demo", "tests/**/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["S101", "S603", "S607", "S404", "RUF001", "RUF002", "RUF003", "PTH123", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"eval/**" = ["S", "PTH"]
"src/obey_cli/enforce/engine/**" = ["UP", "PTH", "SIM102", "SIM103", "B007", "E501"]
"src/obey_cli/enforce/templates/**" = ["UP", "PTH"]
"src/obey_cli/runner/gateway.py" = ["UP", "PTH"]
"src/obey_cli/runner/egress_proxy.py" = ["UP", "PTH"]
"src/obey_cli/runner/sidecar.py" = ["UP", "PTH", "E402"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/obey_cli"]
# Hook templates are standalone scripts copied into users' repositories; they are tested under Python 3.9.
exclude = ["src/obey_cli/enforce/templates/"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*", "egress_proxy", "gateway"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs network access (skipped by default)",
    "docker: test needs a container runtime (skipped by default)",
    "live: test calls a paid model API (never in default CI)",
]
