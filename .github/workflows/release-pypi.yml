name: Publish to PyPI

# Manual only: run it for a v* tag after the GitHub release exists. Uses trusted publishing (no token).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/obey-cli
    permissions:
      id-token: write
    steps:
      - name: Check the ref is a version tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in v[0-9]*) ;; *) echo "ref must be a v* tag" >&2; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
